<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Sequence</title>
    <style>
        /* 画面全体の設定：背景黒、余白なし、スクロールバー非表示 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* クリックできることを示す */
        }

        /* メディア（動画・画像）の基本設定：最初は非表示 */
        .media {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain; /* アスペクト比を保って画面に収める */
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 表示状態のクラス */
        .active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 動画・画像ファイル -->
    <video id="media-a1" class="media" src="./a1.mp4" playsinline></video>
    <img id="media-img" class="media" src="./image.png" alt="image">
    <video id="media-a2" class="media" src="./a2.mp4" playsinline></video>
    
    <!-- 音声ファイル 4つ分 -->
    <audio id="audio-18" src="./18.m4a"></audio>
    <audio id="audio-16" src="./16.m4a"></audio>
    <audio id="audio-17" src="./17.m4a"></audio>
    <audio id="audio-tas" src="./tas.mp3"></audio>

    <script>
        // 状態管理: 何回スペースが押されたか
        let currentState = 0;

        // 動画・画像のエレメント取得
        const a1 = document.getElementById('media-a1');
        const img = document.getElementById('media-img');
        const a2 = document.getElementById('media-a2');
        const visualMedia = [a1, img, a2]; 

        // 音声のエレメント取得
        const audio18 = document.getElementById('audio-18');
        const audio16 = document.getElementById('audio-16');
        const audio17 = document.getElementById('audio-17');
        const audioTas = document.getElementById('audio-tas');
        const allAudio = [audio18, audio16, audio17, audioTas];

        // 1. スペースキーでの進行処理
        document.addEventListener('keydown', (event) => {
            // スペースキー（Space）が押されたら
            if (event.code === 'Space') {
                event.preventDefault(); // スペースキーによる画面スクロールを防ぐ
                currentState++;
                updateScreen();
            }
        });

        // 2. 画面クリックでの全画面（フルスクリーン）切り替え処理
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // 全画面にする
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                // 全画面を解除する
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // 3. 画面の表示・音声を切り替える関数
        function updateScreen() {
            // 一旦すべての画像・動画を非表示にして、動画を一時停止・巻き戻す
            visualMedia.forEach(media => {
                media.classList.remove('active');
                if (media.tagName === 'VIDEO') {
                    media.pause();
                    media.currentTime = 0;
                }
            });
            
            // すべての音声を一旦停止・巻き戻す
            allAudio.forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            // 状態に応じて表示・再生
            if (currentState === 1) {
                // スペース1回目: a1.mp4
                a1.classList.add('active');
                a1.play();
            } else if (currentState === 2) {
                // スペース2回目: image.png + 18.m4a
                img.classList.add('active');
                audio18.play();
            } else if (currentState === 3) {
                // スペース3回目: image.png + tas.mp3
                img.classList.add('active');
                audioTas.play();
            } else if (currentState === 4) {
                // スペース4回目: image.png + 16.m4a
                img.classList.add('active');
                audio16.play();
            } else if (currentState === 5) {
                // スペース5回目: image.png + 17.m4a
                img.classList.add('active');
                audio17.play();
            } else if (currentState === 6) {
                // スペース6回目: image.png + tas.mp3
                img.classList.add('active');
                audioTas.play();
            } else if (currentState === 7) {
                // スペース7回目: a2.mp4
                a2.classList.add('active');
                a2.play();
            }
            // スペース8回目以降は、上記のどの条件にも当てはまらないため、全て非表示・停止したまま（黒画面）になります。
        }
    </script>
</body>
</html>
