<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Sequence</title>
    <style>
        /* 画面全体の設定：背景黒、余白なし、スクロールバー非表示 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer; /* クリックできることを示す */
        }

        /* メディア（動画・画像）の基本設定：最初は非表示 */
        .media {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain; /* アスペクト比を保って画面に収める */
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 表示状態のクラス */
        .active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- ファイル名をご自身のものに合わせて変更してください -->
    <video id="media-a1" class="media" src="./a1.mp4" playsinline></video>
    <img id="media-img" class="media" src="./image.png" alt="image">
    <video id="media-a2" class="media" src="./a2.mp4" playsinline></video>
    
    <!-- 音声ファイル -->
    <audio id="media-audio" src="./カンナム.mp3"></audio>

    <script>
        // 状態管理: 0=黒画面, 1=a1動画, 2=画像のみ, 3=画像+音楽, 4=a2動画, 5=黒画面(終了)
        let currentState = 0;

        const a1 = document.getElementById('media-a1');
        const img = document.getElementById('media-img');
        const a2 = document.getElementById('media-a2');
        const audio = document.getElementById('media-audio');
        
        const visualMedia = [a1, img, a2]; 

        // 1. スペースキーでの進行処理
        document.addEventListener('keydown', (event) => {
            // スペースキー（Space）が押されたら
            if (event.code === 'Space') {
                event.preventDefault(); // スペースキーによる画面スクロールを防ぐ
                currentState++;
                updateScreen();
            }
        });

        // 2. 画面クリックでの全画面（フルスクリーン）切り替え処理
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                // 全画面にする
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                // 全画面を解除する
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // 3. 画面の表示を切り替える関数
        function updateScreen() {
            // 一旦すべての画像・動画を非表示にして、動画を一時停止・巻き戻す
            visualMedia.forEach(media => {
                media.classList.remove('active');
                if (media.tagName === 'VIDEO') {
                    media.pause();
                    media.currentTime = 0;
                }
            });
            
            // 音声も一旦停止・巻き戻す
            audio.pause();
            audio.currentTime = 0;

            // 状態に応じて表示・再生
            if (currentState === 1) {
                // 1. a1.mp4
                a1.classList.add('active');
                a1.play();
            } else if (currentState === 2) {
                // 2. image.png
                img.classList.add('active');
            } else if (currentState === 3) {
                // 3. image.png + カンナム.mp3
                img.classList.add('active');
                audio.play();
            } else if (currentState === 4) {
                // 4. a2.mp4 (画像と音楽は上でリセット・停止されているので自動で消えます)
                a2.classList.add('active');
                a2.play();
            }
            // currentState が 5以上の場合は何も表示されない・音も鳴らない（終了後の黒画面）
        }
    </script>
</body>
</html>
