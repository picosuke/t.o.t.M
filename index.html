<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Sequence</title>
    <!-- favicon.ico のエラーを防止する設定 -->
    <link rel="icon" href="data:,">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .media {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
        }

        .active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 動画・画像ファイル -->
    <video id="media-a1" class="media" src="./a1.mp4" playsinline preload="auto"></video>
    <img id="media-img" class="media" src="./image.png" alt="image">
    <video id="media-a2" class="media" src="./a2.mp4" playsinline preload="auto"></video>
    
    <!-- 音声ファイル -->
    <audio id="audio-18" src="./18.m4a" preload="auto"></audio>
    <audio id="audio-tas" src="./tas.mp3" preload="auto"></audio>
    <audio id="audio-e" src="./e.m4a" preload="auto"></audio>

    <script>
        let currentState = 0;

        const a1 = document.getElementById('media-a1');
        const img = document.getElementById('media-img');
        const a2 = document.getElementById('media-a2');
        const visualMedia = [a1, img, a2]; 

        const audio18 = document.getElementById('audio-18');
        const audioTas = document.getElementById('audio-tas');
        const audioE = document.getElementById('audio-e');
        const allAudio = [audio18, audioTas, audioE];

        // 再生関数（エラーが起きたらファイル名をコンソールに出す）
        function safePlay(mediaElement, fileName) {
            mediaElement.play().catch(error => {
                console.error(`【エラー】「${fileName}」を再生できませんでした。GitHub上のファイル名や大文字小文字を確認してください。`, error);
            });
        }

        // 1. 数字キー（1〜7）入力
        document.addEventListener('keydown', (event) => {
            if (['1', '2', '3', '4', '5', '6', '7'].includes(event.key)) {
                event.preventDefault();
                currentState = parseInt(event.key, 10);
                updateScreen();
            }
        });

        // 2. クリックで全画面
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`全画面エラー: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // 3. 画面の切り替え
        function updateScreen() {
            // リセット
            visualMedia.forEach(media => {
                media.classList.remove('active');
                if (media.tagName === 'VIDEO') {
                    media.pause();
                    media.currentTime = 0;
                }
            });
            allAudio.forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });

            // 状態に応じた処理
            if (currentState === 1) {
                a1.classList.add('active');
                safePlay(a1, 'a1.mp4');
            } else if (currentState === 2) {
                img.classList.add('active');
                safePlay(audio18, '18.m4a');
            } else if (currentState === 3) {
                img.classList.add('active');
                safePlay(audioTas, 'tas.mp3');
            } else if (currentState === 4) {
                img.classList.add('active');
                safePlay(audioE, 'e.m4a');
            } else if (currentState === 5) {
                img.classList.add('active');
                safePlay(audioTas, 'tas.mp3');
            } else if (currentState === 6) {
                a2.classList.add('active');
                safePlay(a2, 'a2.mp4');
            } else if (currentState === 7) {
                // 黒画面
            }
        }
    </script>
</body>
</html>
